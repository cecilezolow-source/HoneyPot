{% extends "base.html" %}
{% block title %}{{ topf['title'] }} · HoneyPot{% endblock %}
{% block content %}
<a href="{{ url_for('dashboard') }}" class="back-link">&larr; Zurück zum Dashboard</a>

<article class="topf-detail">
    <div class="topf-detail-header">
        <div class="topf-card-icon big">🍯</div>
        <div>
            <h1>{{ topf['title'] }}</h1>
            <p class="topf-meta">von <strong>{{ topf['username'] }}</strong> &middot; {{ topf['created_at'] }}</p>
        </div>
    </div>
    <div class="topf-content">
        {{ topf['content'] }}
    </div>
</article>
{% endblock %}
