{% extends "base.html" %}
{% block title %}Bearbeiten · HoneyPot{% endblock %}
{% block content %}
<a href="{{ url_for('honigtopf_detail', topf_id=topf['id']) }}" class="back-link">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    Zurück zum Beitrag
</a>

<div class="editor reveal">
    <section class="form-wrap">
        <span class="eyebrow">Beitrag bearbeiten</span>
        <h1>Honigtopf #{{ topf['id'] }} bearbeiten</h1>
        <p class="subtitle">Titel und Inhalt anpassen und speichern.</p>

        <form method="POST" action="{{ url_for('edit_honigtopf', topf_id=topf['id']) }}" class="topf-form js-loading-form">
            <fieldset class="step">
                <legend><span class="step-num">1</span> Titel</legend>
                <div class="field">
                    <input type="text" id="title" name="title" placeholder=" " maxlength="200" value="{{ topf['title'] }}" required>
                    <label for="title">Titel</label>
                    <span class="counter" data-for="title">0 / 200</span>
                </div>
            </fieldset>

            <fieldset class="step">
                <legend><span class="step-num">2</span> Inhalt</legend>
                <div class="field field-area">
                    <textarea id="content" name="content" rows="9" placeholder=" " required>{{ topf['content'] }}</textarea>
                    <label for="content">Inhalt</label>
                    <span class="counter" data-for="content">0 Wörter</span>
                </div>
            </fieldset>

            <button type="submit" class="btn-primary">
                <span class="btn-label">Änderungen speichern</span>
                <span class="btn-spinner" aria-hidden="true"></span>
            </button>
        </form>
    </section>
</div>
{% endblock %}
